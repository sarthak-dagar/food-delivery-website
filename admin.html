<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Orders | Foodie</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <header>
    <nav class="navbar flex between wrapper admin-nav">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-utensils"></i></span>
        <span class="logo-text">Foodie.</span>
        <span class="admin-badge">Admin</span>
      </a>
      <a href="/home" class="btn">Back to Site</a>
    </nav>
  </header>

  <main class="admin-main wrapper">
    <div class="page-head">
      <div>
        <h2>Order Management</h2>
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat-box">
        <span class="stat-icon gold"><i class="fa-solid fa-receipt"></i></span>
        <div class="stat-info">
          <h3>Total Orders</h3>
          <p id="statTotal">-</p>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon orange"><i class="fa-solid fa-hourglass-half"></i></span>
        <div class="stat-info">
          <h3>Pending</h3>
          <p class="gold" id="statPending">-</p>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon green"><i class="fa-solid fa-circle-check"></i></span>
        <div class="stat-info">
          <h3>Completed</h3>
          <p id="statCompleted">-</p>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon dark"><i class="fa-solid fa-sack-dollar"></i></span>
        <div class="stat-info">
          <h3>Revenue</h3>
          <p id="statRevenue">-</p>
        </div>
      </div>
    </div>

    <div class="orders-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none;">
        <i class="fa-solid fa-box-open"></i>
      </div>
    </div>
  </main>

  <footer class="admin-footer">
    Foodie. <strong>Admin Panel</strong> &copy; 2026
  </footer>

  <script defer src="admin.js"></script>
</body>

</html>
