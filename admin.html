<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Orders | Foodie</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--pure-white);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.06);
      padding: 0.75rem 1.5rem;
      border-bottom: 3px solid var(--gold-finger);
      border-radius: 18px;
      margin: 0.75rem auto 0;
      width: calc(100% - 1.5rem);
      max-width: 1400px;
    }

    .admin-nav .logo {
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      aspect-ratio: 1;
      border-radius: 12px;
      background: var(--gold-finger);
      color: var(--lead);
      font-size: 1.2rem;
    }

    .logo-text {
      font-size: 1.7rem;
      font-weight: bold;
      color: var(--gold-finger);
    }

    .admin-badge {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--pure-white);
      background: var(--lead);
      padding: .2rem .6rem;
      border-radius: 999px;
      vertical-align: middle;
      margin-left: .4rem;
    }

    .admin-main {
      padding: 2.5rem 0 3rem;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-left: 1rem;
      border-left: 4px solid var(--gold-finger);
    }

    .page-head h2 {
      font-size: 2.2rem;
      color: var(--lead);
      line-height: 1.2;
    }

    .page-head p {
      font-size: 1.05rem;
      color: #888;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2.2rem;
    }

    .stat-box {
      background: var(--pure-white);
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 1.1rem 1.3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .stat-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
    }

    .stat-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      aspect-ratio: 1;
      border-radius: 14px;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .stat-icon.gold {
      background: var(--hint-yellow);
      color: var(--gold-finger);
    }

    .stat-icon.green {
      background: #e4f6e8;
      color: #2e9e4f;
    }

    .stat-icon.orange {
      background: #fdeee0;
      color: #e07b1f;
    }

    .stat-icon.dark {
      background: #e8e8ea;
      color: var(--lead);
    }

    .stat-info h3 {
      font-size: .8rem;
      color: #999;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .2rem;
    }

    .stat-info p {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--lead);
      line-height: 1.2;
    }

    .stat-info .gold {
      color: var(--gold-finger);
    }

    .orders-table-wrap {
      background: var(--pure-white);
      border: 1px solid #eee;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      text-align: left;
      padding: .9rem 1.25rem;
      border-bottom: 1px solid #f2f2f2;
      font-size: .98rem;
      vertical-align: top;
    }

    thead th {
      background: var(--lead);
      color: var(--hint-yellow);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .78rem;
      font-weight: 700;
      border-bottom: 3px solid var(--gold-finger);
    }

    tbody tr {
      transition: background .2s ease;
    }

    tbody tr:nth-child(even) {
      background: #fbfaf4;
    }

    tbody tr:hover {
      background: var(--hint-yellow);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .order-id {
      font-family: Consolas, Monaco, monospace;
      font-weight: 700;
      color: var(--gold-finger);
      background: var(--hint-yellow);
      padding: .2rem .6rem;
      border-radius: 8px;
      font-size: .85rem;
      white-space: nowrap;
    }

    .customer-name {
      font-weight: 700;
      color: var(--lead);
    }

    .customer-email {
      font-size: .85rem;
      color: #999;
    }

    .order-items {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: flex-start;
      align-items: center;
    }

    .order-item-row {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      background: #f7f5ee;
      border: 1px solid #eee;
      border-radius: 999px;
      padding: .3rem .7rem .3rem .3rem;
      transition: background .2s ease, border-color .2s ease;
    }

    .order-item-row:hover {
      background: var(--hint-yellow);
      border-color: var(--gold-finger);
    }

    .order-item-row img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #eee;
      flex-shrink: 0;
    }

    .order-item-row span {
      font-size: .9rem;
      color: var(--lead);
      white-space: nowrap;
    }

    .total-cell {
      font-weight: 700;
      color: var(--lead);
      white-space: nowrap;
    }

    .date-cell {
      color: #888;
      white-space: nowrap;
    }

    .status-select {
      padding: .4rem .9rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      background: var(--eye-ball);
      color: var(--lead);
      cursor: pointer;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .status-select:focus {
      border-color: var(--gold-finger);
      box-shadow: 0 0 0 3px rgba(242, 189, 18, 0.2);
    }

    .status-select.select-pending {
      background: #fff3cd;
      color: #856404;
      border-color: #f5d97a;
    }

    .status-select.select-completed {
      background: #d4edda;
      color: #155724;
      border-color: #9fd6ab;
    }

    .status-select.select-cancelled {
      background: #f8d7da;
      color: #721c24;
      border-color: #eaa7ae;
    }

    .empty {
      text-align: center;
      padding: 4rem 1rem;
    }

    .empty i {
      font-size: 3rem;
      color: #dcdcdc;
      margin-bottom: 1rem;
    }

    .empty p {
      color: #999;
      font-size: 1.1rem;
      margin: 0;
    }

    .admin-footer {
      text-align: center;
      padding: 1.5rem 0;
      color: #bbb;
      font-size: .9rem;
      border-top: 1px solid #eee;
      margin-top: 3rem;
    }

    .admin-footer strong {
      color: var(--gold-finger);
    }

    @media (max-width: 640px) {
      .page-head h2 {
        font-size: 1.7rem;
      }

      .admin-nav .logo {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav class="navbar flex between wrapper admin-nav">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-utensils"></i></span>
        <span class="logo-text">Foodie.</span>
        <span class="admin-badge">Admin</span>
      </a>
      <a href="index.html" class="btn">Back to Site</a>
    </nav>
  </header>

  <main class="admin-main wrapper">
    <div class="page-head">
      <div>
        <h2>Order Management</h2>
        <p>Saare orders yahan dikhte hain.</p>
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat-box">
        <span class="stat-icon gold"><i class="fa-solid fa-receipt"></i></span>
        <div class="stat-info">
          <h3>Total Orders</h3>
          <p id="statTotal">-</p>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon orange"><i class="fa-solid fa-hourglass-half"></i></span>
        <div class="stat-info">
          <h3>Pending</h3>
          <p class="gold" id="statPending">-</p>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon green"><i class="fa-solid fa-circle-check"></i></span>
        <div class="stat-info">
          <h3>Completed</h3>
          <p id="statCompleted">-</p>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon dark"><i class="fa-solid fa-sack-dollar"></i></span>
        <div class="stat-info">
          <h3>Revenue</h3>
          <p id="statRevenue">-</p>
        </div>
      </div>
    </div>

    <div class="orders-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none;">
        <i class="fa-solid fa-box-open"></i>
        <p>Abhi koi order nahi hai.</p>
      </div>
    </div>
  </main>

  <footer class="admin-footer">
    Foodie. <strong>Admin Panel</strong> &copy; 2026
  </footer>

  <script>
    const loadOrders = async () => {
      const res = await fetch('/api/orders/all');
      const orders = await res.json();
      if (!res.ok) {
        alert(orders.message || 'Orders load nahi hue');
        return;
      }

      const body = document.getElementById('ordersBody');
      body.innerHTML = '';

      let total = 0, pending = 0, completed = 0, revenue = 0;

      orders.forEach(order => {
        total++;
        if (order.status === 'pending') pending++;
        if (order.status === 'completed') completed++;
        revenue += parseFloat(order.total.replace('$', ''));

        const itemsHtml = order.items.map(i => `
          <div class="order-item-row">
            <img src="${i.product.image}" alt="">
            <span>${i.product.name} &times; ${i.quantity}</span>
          </div>`).join('');

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><span class="order-id">#${order.id.slice(-6)}</span></td>
          <td>
            <span class="customer-name">${order.userName}</span><br>
            <span class="customer-email">${order.userEmail}</span>
          </td>
          <td><div class="order-items">${itemsHtml}</div></td>
          <td class="total-cell">${order.total}</td>
          <td class="date-cell">${new Date(order.createdAt).toLocaleDateString()}</td>
          <td>
            <select class="status-select select-${order.status}" data-id="${order.id}">
              <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Completed</option>
              <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </td>`;
        body.appendChild(row);
      });

      document.getElementById('emptyState').style.display = orders.length ? 'none' : 'block';
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statRevenue').textContent = '$' + revenue.toFixed(2);
    };

    document.getElementById('ordersBody').addEventListener('change', async (e) => {
      const select = e.target.closest('.status-select');
      if (!select) return;
      const res = await fetch(`/api/orders/${select.dataset.id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: select.value })
      });
      const data = await res.json();
      if (res.ok) {
        loadOrders();
      } else {
        alert(data.message || 'Status update nahi hua');
        loadOrders();
      }
    });

    loadOrders();
  </script>
</body>

</html>
